# Обновляет данные сайта: выпуски BreezeCAD → data/releases.json (и версия/размеры
# на главной), каталог BreezeCAD/registry → data/registry-index.json.
# Раз в сутки, по событию (новый выпуск программы, обновился каталог) и вручную.
# Если что-то изменилось — коммит в main, GitHub Pages публикует сам.
name: sync-data

on:
  schedule:
    - cron: '41 3 * * *'           # 06:41 по Москве — после сборки каталога
  repository_dispatch:
    types: [breezecad-released, registry-updated]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-data
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch releases and the catalog
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/sync_data.py
      - name: Commit if changed
        run: |
          if git diff --quiet -- data index.html en/index.html; then
            echo "Данные не изменились."; exit 0
          fi
          git config user.name  "breezecad-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data index.html en/index.html
          git commit -m "data: свежие выпуски и каталог"
          git push
